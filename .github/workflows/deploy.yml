name: Deploy

# main 有变更就部署 Worker + Web
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 设置 Worker 密钥（幂等，不进代码）
          echo "${{ secrets.SUPABASE_ANON_KEY }}" | npx -y wrangler secret put SUPABASE_ANON_KEY
          if [ -n "${{ secrets.TURNSTILE_SECRET }}" ]; then
            echo "${{ secrets.TURNSTILE_SECRET }}" | npx -y wrangler secret put TURNSTILE_SECRET
          fi
          # 部署 Worker（wrangler.toml 已设 workers_dev = false，不会重新打开 workers.dev）
          npx -y wrangler deploy

      - name: Deploy Web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler pages deploy web --project-name=muse-invite-web --branch=main --commit-hash=${{ github.sha }}
