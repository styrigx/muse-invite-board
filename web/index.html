<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muse 邀请码共享站</title>
<link rel="dns-prefetch" href="https://muse-invite-board.styrigx.workers.dev">
<link rel="preconnect" href="https://muse-invite-board.styrigx.workers.dev">
<style>
:root{
  --bg:#070b16; --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.09);
  --txt:#eef2ff; --dim:#93a0b8; --acc:#a78bfa; --acc2:#67e8f9; --gold:#e8c15a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--txt); min-height:100vh; -webkit-tap-highlight-color:transparent;
}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg::before{content:"";position:absolute;width:640px;height:640px;left:-180px;top:-180px;
  background:radial-gradient(circle,rgba(167,139,250,.22),transparent 65%);filter:blur(10px)}
.bg::after{content:"";position:absolute;width:560px;height:560px;right:-160px;top:30%;
  background:radial-gradient(circle,rgba(103,232,249,.14),transparent 65%);filter:blur(10px)}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 60px}
nav{display:flex;align-items:center;padding:20px 2px}
.logo{font-weight:800;font-size:17px;letter-spacing:1px}
.logo span{background:linear-gradient(120deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero{text-align:center;padding:34px 0 8px}
.hero h1{font-size:34px;font-weight:800;letter-spacing:2px;
  background:linear-gradient(120deg,#fff 20%,#c7d2fe 60%,var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--dim);font-size:14px;margin-top:12px;line-height:1.9}
.stats{display:flex;gap:12px;margin:26px 0}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 8px;text-align:center;backdrop-filter:blur(8px)}
.stat b{font-size:24px;display:block;background:linear-gradient(120deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat small{color:var(--dim);font-size:12px}
.owner{margin:6px 0 22px;padding:20px;border-radius:18px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,rgba(232,193,90,.14),rgba(232,193,90,.04));
  border:1px solid rgba(232,193,90,.45)}
.owner::before{content:"";position:absolute;inset:0;
  background:linear-gradient(110deg,transparent 30%,rgba(232,193,90,.12) 50%,transparent 70%);animation:sheen 4s linear infinite}
@keyframes sheen{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.owner .tag{display:inline-block;font-size:12px;font-weight:700;color:#3a2c07;background:linear-gradient(120deg,#f6d97b,#e8c15a);
  padding:4px 12px;border-radius:99px;margin-bottom:12px}
.owner .code{font-size:34px;font-weight:800;letter-spacing:8px;color:#f6d97b;font-family:ui-monospace,Menlo,monospace;cursor:pointer}
.owner .who{color:var(--dim);font-size:13px;margin-top:8px}
.owner .tip{color:#9a8656;font-size:12px;margin-top:6px}
.drawbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 20px;text-align:center;margin-bottom:22px;backdrop-filter:blur(8px)}
.draw-code{font-size:46px;font-weight:800;letter-spacing:10px;min-height:66px;font-family:ui-monospace,Menlo,monospace;
  background:linear-gradient(120deg,#fff,var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.draw-code:empty::before{content:"– – –";opacity:.25;-webkit-text-fill-color:var(--dim);background:none}
.draw-btns{display:flex;gap:10px;justify-content:center;margin-top:14px}
.btn{border:none;cursor:pointer;font-size:16px;font-weight:700;color:#0b0620;
  padding:14px 34px;border-radius:99px;background:linear-gradient(120deg,var(--acc),var(--acc2));
  box-shadow:0 8px 28px rgba(167,139,250,.35);transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn-ghost{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);
  padding:14px 26px;border-radius:99px;font-size:15px;cursor:pointer}
.btn-ghost:active{transform:scale(.96)}
.sec-t{font-size:15px;font-weight:700;margin:26px 0 14px;display:flex;align-items:center;gap:8px}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line)}
.codes{display:grid;gap:12px}
.code-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;backdrop-filter:blur(8px)}
.code-card .row1{display:flex;align-items:center;justify-content:space-between}
.code-card .c{font-size:22px;font-weight:800;letter-spacing:4px;font-family:ui-monospace,Menlo,monospace}
.code-card .meta{font-size:12px;color:var(--dim);margin-top:8px}
.code-card .meta b{color:var(--txt)}
.code-card .meta .fl{color:#fca5a5}
.mini{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);
  border-radius:10px;padding:8px 16px;font-size:13px;cursor:pointer}
.mini:active{background:rgba(167,139,250,.18)}
.vote{display:flex;gap:8px;margin-top:12px}
.vote button{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--txt);
  border-radius:12px;padding:10px;font-size:13px;cursor:pointer}
.vote button:active{background:rgba(167,139,250,.18)}
.vote button:disabled{opacity:.4}
.empty{text-align:center;color:var(--dim);font-size:14px;padding:30px 0;line-height:2}
.share{display:flex;gap:10px}
.share input{flex:1;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px;
  padding:14px;font-size:18px;letter-spacing:6px;text-align:center;color:var(--txt);
  font-family:ui-monospace,Menlo,monospace;outline:none;min-width:0;text-transform:uppercase}
.share input:focus{border-color:var(--acc)}
.share .btn{flex:0 0 104px;padding:14px 0;font-size:15px}
footer{text-align:center;color:var(--dim);font-size:12px;margin-top:44px;line-height:2}
footer a{color:var(--acc);text-decoration:none}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:#1c2540;
  border:1px solid var(--line);padding:13px 22px;border-radius:14px;font-size:14px;display:none;
  z-index:9;max-width:92vw;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <nav>
    <div class="logo">🎟️ <span>Muse 邀请码</span></div>
  </nav>

  <div class="hero">
    <h1>邀请码共享站</h1>
    <p>Muse 注册需要邀请码<br>这里<b style="color:#c7d2fe">免费领码</b> · 网友互助 · 失效自动隐藏</p>
  </div>

  <div class="stats">
    <div class="stat"><b id="stCodes">–</b><small>码池邀请码</small></div>
    <div class="stat"><b id="stDraws">–</b><small>累计抽取</small></div>
    <div class="stat"><b id="stWorks">–</b><small>人说能用 👍</small></div>
  </div>

  <div class="owner">
    <span class="tag">⭐ 站长分享</span>
    <div class="code" onclick="copy('J93R39')">J93R39</div>
    <div class="who">来自站长 @styrigx，亲测可用（点击可复制）</div>
    <div class="tip">站长码长期有效 · 不参与随机抽取 · 点下面按钮抽网友分享的码</div>
  </div>

  <div class="drawbox">
    <div class="draw-code" id="drawCode"></div>
    <div class="draw-btns">
      <button class="btn" id="drawBtn">🎲 抽一个邀请码</button>
      <button class="btn-ghost" id="copyDrawBtn">复制</button>
    </div>
  </div>

  <div class="sec-t">📋 网友分享的码</div>
  <div class="codes" id="list"><div class="empty">加载中…</div></div>

  <div class="sec-t">💝 分享你的邀请码</div>
  <div class="share">
    <input id="codeInput" maxlength="6" placeholder="输入6位邀请码" autocomplete="off">
    <button class="btn" id="submitBtn">提交</button>
  </div>

  <footer>
    由 Cloudflare Workers + Supabase + Vercel 强力驱动<br>
    站长 <a href="https://x.com/styrigx" target="_blank" rel="noopener">@styrigx</a> · 随缘更新
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
const API="https://muse-invite-board.styrigx.workers.dev";
const $=id=>document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2200)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('已复制：'+t)}catch{const i=document.createElement('input');i.value=t;document.body.appendChild(i);i.select();document.execCommand('copy');i.remove();toast('已复制：'+t)}}
async function load(){
 const r=await fetch(API+'/api/codes');const d=await r.json();
 const box=$('list');
 const cs=d.codes||[];
 $('stCodes').textContent=cs.length;
 $('stDraws').textContent=cs.reduce((s,c)=>s+(c.draws||0),0);
 $('stWorks').textContent=cs.reduce((s,c)=>s+(c.works||0),0);
 if(!cs.length){box.innerHTML='<div class="empty">板子还是空的<br>来贡献第一个吧 👆</div>';return}
 box.innerHTML=cs.map(c=>
 `<div class="code-card">
   <div class="row1"><span class="c">${c.code}</span><button class="mini" onclick="copy('${c.code}')">复制</button></div>
   <div class="meta">${c.by} · 👍 <b>${c.works}</b>人说能用 · 已抽${c.draws}次 · <span class="fl">${c.flags}</span>人标记</div>
   <div class="vote">
     <button class="w" onclick="vote('${c.code}','works',this)">👍 能用</button>
     <button class="f" onclick="vote('${c.code}','flag',this)">标记失效</button>
   </div>
 </div>`).join('');
}
async function vote(code,kind,btn){
 btn.disabled=true;
 const r=await fetch(API+'/api/vote',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({code,kind})});
 const d=await r.json();
 if(!r.ok)toast(d.error||'操作失败');else{toast(kind==='works'?'感谢反馈！':'已标记，谢谢');load()}
}
$('drawBtn').onclick=async()=>{
 const r=await fetch(API+'/api/draw',{method:'POST'});const d=await r.json();
 if(!r.ok){toast(d.error||'抽取失败');return}
 $('drawCode').textContent=d.code;copy(d.code);
};
$('copyDrawBtn').onclick=()=>{const c=$('drawCode').textContent;if(/^[A-Z0-9]{6}$/.test(c))copy(c);else toast('先抽一个吧')};
$('submitBtn').onclick=async()=>{
 const code=$('codeInput').value.trim().toUpperCase();
 if(!/^[A-Z0-9]{6}$/.test(code)){toast('格式不对，应为6位字母/数字');return}
 const r=await fetch(API+'/api/submit',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({code})});
 const d=await r.json();
 if(!r.ok)toast(d.error||'提交失败');else{toast('贡献成功，感谢！');$('codeInput').value='';load()}
};
load();
</script>
</body>
</html>
