<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muse 邀请码共享站</title>
<style>
:root{
  --bg:#070b16; --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.09);
  --txt:#eef2ff; --dim:#93a0b8; --acc:#a78bfa; --acc2:#67e8f9; --gold:#e8c15a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--txt); min-height:100vh; -webkit-tap-highlight-color:transparent;
}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg::before{content:"";position:absolute;width:640px;height:640px;left:-180px;top:-180px;
  background:radial-gradient(circle,rgba(167,139,250,.22),transparent 65%);filter:blur(10px)}
.bg::after{content:"";position:absolute;width:560px;height:560px;right:-160px;top:30%;
  background:radial-gradient(circle,rgba(103,232,249,.14),transparent 65%);filter:blur(10px)}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 60px}
nav{display:flex;align-items:center;justify-content:space-between;padding:20px 2px}
.logo{font-weight:800;font-size:17px;letter-spacing:1px}
.logo span{background:linear-gradient(120deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.navlink{font-size:13px;color:var(--dim);text-decoration:none;border:1px solid var(--line);padding:7px 14px;border-radius:99px}
.hero{text-align:center;padding:34px 0 8px}
.hero h1{font-size:34px;font-weight:800;letter-spacing:2px;
  background:linear-gradient(120deg,#fff 20%,#c7d2fe 60%,var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--dim);font-size:14px;margin-top:12px;line-height:1.9}
.stats{display:flex;gap:12px;margin:26px 0}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 8px;text-align:center;backdrop-filter:blur(8px)}
.stat b{font-size:24px;display:block;background:linear-gradient(120deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat small{color:var(--dim);font-size:12px}
.owner{margin:6px 0 22px;padding:20px;border-radius:18px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,rgba(232,193,90,.14),rgba(232,193,90,.04));
  border:1px solid rgba(232,193,90,.45)}
.owner::before{content:"";position:absolute;inset:0;
  background:linear-gradient(110deg,transparent 30%,rgba(232,193,90,.12) 50%,transparent 70%);animation:sheen 4s linear infinite}
@keyframes sheen{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.owner .tag{display:inline-block;font-size:12px;font-weight:700;color:#3a2c07;background:linear-gradient(120deg,#f6d97b,#e8c15a);
  padding:4px 12px;border-radius:99px;margin-bottom:12px}
.owner .code{font-size:34px;font-weight:800;letter-spacing:8px;color:#f6d97b;font-family:ui-monospace,Menlo,monospace}
.owner .who{color:var(--dim);font-size:13px;margin-top:8px}
.owner .tip{color:#9a8656;font-size:12px;margin-top:6px}
.drawbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 20px;text-align:center;margin-bottom:22px;backdrop-filter:blur(8px)}
.btn{display:inline-block;border:none;cursor:pointer;font-size:16px;font-weight:700;color:#0b0620;
  padding:15px 46px;border-radius:99px;background:linear-gradient(120deg,var(--acc),var(--acc2));
  box-shadow:0 8px 28px rgba(167,139,250,.35);transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.55}
.drawn{font-size:44px;font-weight:800;letter-spacing:10px;margin:18px 0 6px;font-family:ui-monospace,Menlo,monospace;
  background:linear-gradient(120deg,#fff,var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.copyhint{font-size:12px;color:var(--dim)}
.sec-t{font-size:15px;font-weight:700;margin:26px 0 14px;display:flex;align-items:center;gap:8px}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line)}
.codes{display:grid;gap:12px}
.code-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;backdrop-filter:blur(8px)}
.code-card .row1{display:flex;align-items:center;justify-content:space-between}
.code-card .c{font-size:22px;font-weight:800;letter-spacing:4px;font-family:ui-monospace,Menlo,monospace}
.code-card .meta{font-size:12px;color:var(--dim);margin-top:8px}
.vote{display:flex;gap:8px;margin-top:12px}
.vote button{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--txt);
  border-radius:12px;padding:10px;font-size:13px;cursor:pointer;transition:background .15s}
.vote button:active{background:rgba(167,139,250,.18)}
.vote button:disabled{opacity:.4}
.empty{text-align:center;color:var(--dim);font-size:14px;padding:30px 0}
form.share{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;backdrop-filter:blur(8px)}
form.share input{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px;
  padding:15px;font-size:20px;letter-spacing:8px;text-align:center;color:var(--txt);font-family:ui-monospace,Menlo,monospace;outline:none}
form.share input:focus{border-color:var(--acc)}
form.share .btn{width:100%;margin-top:14px}
.msg{font-size:13px;margin-top:12px;min-height:20px;text-align:center}
.msg.ok{color:#6ee7b7}.msg.err{color:#fca5a5}
footer{text-align:center;color:var(--dim);font-size:12px;margin-top:44px;line-height:2}
footer a{color:var(--acc);text-decoration:none}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:#1c2333;
  border:1px solid var(--line);padding:12px 22px;border-radius:99px;font-size:14px;opacity:0;transition:all .25s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <nav>
    <div class="logo">🎟️ <span>Muse 邀请码</span></div>
    <a class="navlink" href="https://muse-invite-board.styrigx.workers.dev/" target="_blank" rel="noopener">API 状态</a>
  </nav>

  <div class="hero">
    <h1>邀请码共享站</h1>
    <p>Muse 注册需要邀请码<br>这里<b style="color:#c7d2fe">免费领码</b> · 网友互助 · 失效自动隐藏</p>
  </div>

  <div class="stats">
    <div class="stat"><b id="st-codes">–</b><small>在架邀请码</small></div>
    <div class="stat"><b id="st-draws">–</b><small>累计被抽取</small></div>
    <div class="stat"><b id="st-works">–</b><small>有效投票</small></div>
  </div>

  <div class="owner">
    <span class="tag">⭐ 站长分享</span>
    <div class="code">J93R39</div>
    <div class="who">来自站长 @styrigx，亲测可用</div>
    <div class="tip">站长码长期有效 · 不参与随机抽取 · 点下面按钮抽网友分享的码</div>
  </div>

  <div class="drawbox">
    <button class="btn" id="drawBtn" onclick="draw()">🎲 抽一个邀请码</button>
    <div class="drawn" id="drawn" style="display:none"></div>
    <div class="copyhint" id="drawHint" style="display:none">点击邀请码可复制</div>
  </div>

  <div class="sec-t">📋 网友分享的码</div>
  <div class="codes" id="list"><div class="empty">加载中…</div></div>

  <div class="sec-t">💝 分享你的邀请码</div>
  <form class="share" onsubmit="return submitCode(event)">
    <input id="codeInput" maxlength="6" placeholder="输入 6 位邀请码" autocomplete="off">
    <button class="btn" type="submit">提交上架</button>
    <div class="msg" id="msg"></div>
  </form>

  <footer>
    由 Cloudflare Workers + Supabase + Vercel 强力驱动<br>
    站长 <a href="https://x.com/styrigx" target="_blank" rel="noopener">@styrigx</a> · 随缘更新
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
// 后端 API 地址（Cloudflare Worker）
const API = "https://muse-invite-board.styrigx.workers.dev";
const $ = id => document.getElementById(id);
const voted = new Set(JSON.parse(localStorage.getItem("voted") || "[]"));

function toast(t){
  const el = $("toast"); el.textContent = t; el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"), 2200);
}
function copyTxt(t){
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject())
    .then(()=>toast("已复制 " + t)).catch(()=>toast(t));
}
async function load(){
  try{
    const r = await fetch(API + "/api/codes");
    const d = await r.json();
    const codes = d.codes || [];
    $("st-codes").textContent = codes.length;
    $("st-draws").textContent = codes.reduce((s,c)=>s+c.draws,0);
    $("st-works").textContent = codes.reduce((s,c)=>s+c.works,0);
    const box = $("list");
    if(!codes.length){ box.innerHTML = '<div class="empty">板子空空如也，快来贡献第一个吧 👆</div>'; return; }
    box.innerHTML = codes.map(c=>`
      <div class="code-card">
        <div class="row1">
          <span class="c" onclick="copyTxt('${c.code}')" style="cursor:pointer">${c.code}</span>
          <span style="font-size:12px;color:var(--dim)">${c.draws} 次抽取</span>
        </div>
        <div class="meta">👍 ${c.works} 人说可用 · 分享者 ${c.by}</div>
        <div class="vote">
          <button onclick="vote('${c.code}','works',this)" ${voted.has(c.code)?"disabled":""}>👍 可用${voted.has(c.code)?"（已投）":""}</button>
          <button onclick="vote('${c.code}','flag',this)" ${voted.has(c.code)?"disabled":""}>🚩 失效${voted.has(c.code)?"（已投）":""}</button>
        </div>
      </div>`).join("");
  }catch(e){ $("list").innerHTML = '<div class="empty">加载失败，刷新试试</div>'; }
}
async function draw(){
  const btn = $("drawBtn"); btn.disabled = true; btn.textContent = "抽取中…";
  try{
    const r = await fetch(API + "/api/draw", {method:"POST"});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || "抽取失败");
    const el = $("drawn");
    el.textContent = d.code; el.style.display = "block";
    el.onclick = ()=>copyTxt(d.code); el.style.cursor = "pointer";
    $("drawHint").style.display = "block";
    toast("🎉 抽到 " + d.code);
    load();
  }catch(e){ toast(e.message); }
  btn.disabled = false; btn.textContent = "🎲 抽一个邀请码";
}
async function submitCode(e){
  e.preventDefault();
  const input = $("codeInput"), msg = $("msg");
  const code = input.value.trim().toUpperCase();
  if(!/^[A-Z0-9]{6}$/.test(code)){ msg.className="msg err"; msg.textContent="请输入 6 位字母/数字组合"; return false; }
  msg.className="msg"; msg.textContent="提交中…";
  try{
    const r = await fetch(API + "/api/submit", {method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify({code})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || "提交失败");
    msg.className="msg ok"; msg.textContent="✅ 上架成功，感谢分享！";
    input.value=""; load();
  }catch(err){ msg.className="msg err"; msg.textContent="❌ " + err.message; }
  return false;
}
async function vote(code, kind, btn){
  btn.disabled = true;
  try{
    const r = await fetch(API + "/api/vote", {method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify({code, kind})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || "投票失败");
    voted.add(code); localStorage.setItem("voted", JSON.stringify([...voted]));
    toast(kind==="works" ? "感谢反馈！" : "已标记，3 次标记后自动下架");
    load();
  }catch(e){ toast(e.message); btn.disabled = false; }
}
load();
</script>
</body>
</html>
